name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # internal/webp 走 cgo，测试需要 libwebp 的头文件与库。
      - name: Install libwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebp-dev
      - run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, runner: ubuntu-latest }
          - { goos: windows, runner: ubuntu-latest }
          # pkgbuild only exists on macOS; the darwin job runs there.
          - { goos: darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full binutils nsis upx-ucl cmake
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz"
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/checksums.txt \
            | awk '/^.*  nfpm_2\.48\.0_Linux_x86_64\.tar\.gz$/ {print $1 "  /tmp/nfpm.tar.gz"}' | sha256sum -c -
          tar -C /usr/local/bin -xzf /tmp/nfpm.tar.gz nfpm
      - name: Install UPX and cmake (macOS)
        if: runner.os == 'macOS'
        run: brew install upx cmake
      # libwebp 一律用 zig 交叉编译成静态库（连 macOS 也是：Xcode 26 的
      # math.h 在 x86_64 目标下用到 clang 不支持的 _Float16）。zig 自带
      # libc 头文件，不需要 SDK；macOS 的 Go 链接仍交给原生 clang。
      - name: Install zig
        env:
          ZIG_VERSION: "0.17.0"
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
              sha256="1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026" ;;
            Darwin-arm64)
              url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
              sha256="b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a" ;;
            *)
              echo "unsupported runner: $(uname -s)-$(uname -m)" >&2
              exit 1 ;;
          esac
          curl -fsSL -o /tmp/zig.tar.xz "$url"
          echo "${sha256}  /tmp/zig.tar.xz" | shasum -a 256 -c -
          mkdir -p /tmp/zig
          tar -xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"
      - name: Fetch libwebp source
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/libwebp.tar.gz \
            "https://github.com/webmproject/libwebp/archive/v1.6.0.tar.gz"
          echo "93a852c2b3efafee3723efd4636de855b46f9fe1efddd607e1f42f60fc8f2136  /tmp/libwebp.tar.gz" \
            | shasum -a 256 -c -
          mkdir -p /tmp/libwebp
          tar -xzf /tmp/libwebp.tar.gz -C /tmp/libwebp --strip-components=1
      - name: Build
        # 每个目标都先用 cmake 把 libwebp 编成静态库，再以 cgo 静态链接进
        # Go 二进制。产物是单个可执行文件，不依赖系统 libwebp，Linux 产物
        # 还是完全静态的（glibc / musl 发行版通用）。
        env:
          GOOS: ${{ matrix.goos }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"

          # Download and prune the tesseract installers once; both x86 and
          # x64 stages copy from these trees. A plain case instead of an
          # associative array keeps this script compatible with bash 3.2,
          # which macOS runners still use.
          tesseract_dir() {
            case "$1" in
              w32) echo /tmp/tesseract-w32 ;;
              w64) echo /tmp/tesseract-w64 ;;
            esac
          }
          if [ "$GOOS" = "windows" ]; then
            for spec in "w32 5.3.0.20221222 33d7824a440e1660b74dc55f10355b346a22fdbe430143f7f6885cfa3cfdf7e7" \
                        "w64 5.4.0.20240606 c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9"; do
              read -r arch tessver hash <<< "$spec"
              installer="/tmp/tesseract-$arch.exe"
              curl -fsSL -o "$installer" \
                "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-$arch-setup-$tessver.exe"
              echo "$hash  $installer" | shasum -a 256 -c -
              # The installer is an NSIS archive; 7z extracts it without running it.
              mkdir "/tmp/tesseract-$arch"
              7z x -o"/tmp/tesseract-$arch" "$installer" > /dev/null
              # Drop the ~160MB of unrelated tooling the installer carries and
              # keep only the DLLs tesseract.exe loads, directly or transitively.
              python3 .github/scripts/prune_tesseract.py "/tmp/tesseract-$arch"
              # Strip debug symbols: shrinks the bundle ~5x, imports untouched.
              for f in "/tmp/tesseract-$arch/tesseract.exe" "/tmp/tesseract-$arch"/*.dll; do
                objcopy --strip-all "$f"
              done
            done
          fi

          # 为目标平台编译静态 libwebp，并生成注入 zig/clang 参数的 CC 包装。
          build_libwebp() {
            local name="$1" zig_target="$2"
            local b="/tmp/libwebp-$name"
            rm -rf "$b"
            mkdir -p "$b"
            printf '#!/bin/sh\nexec zig cc -target %s "$@"\n' "$zig_target" > "$b/cc.sh"
            chmod +x "$b/cc.sh"
            cmake -S /tmp/libwebp -B "$b/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_C_COMPILER="$b/cc.sh" \
              -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
              -DWEBP_BUILD_ANIM_UTILS=OFF \
              -DWEBP_BUILD_CWEBP=OFF \
              -DWEBP_BUILD_DWEBP=OFF \
              -DWEBP_BUILD_GIF2WEBP=OFF \
              -DWEBP_BUILD_IMG2WEBP=OFF \
              -DWEBP_BUILD_VWEBP=OFF \
              -DWEBP_BUILD_WEBPINFO=OFF \
              -DWEBP_BUILD_LIBWEBPMUX=OFF \
              -DWEBP_BUILD_EXTRAS=OFF \
              -DWITH_JPEG=OFF \
              -DWITH_PNG=OFF \
              -DWITH_TIFF=OFF \
              -DWITH_SIMD=0 > /dev/null
            cmake --build "$b/build" -j"$jobs" > /dev/null
          }

          build_one() {
            local goarch="$1" goarm="$2" name="$3" nfpm_arch="$4" tess="$5"
            local zig_target="" mac_arch="" extra_ld="-static"
            case "$name" in
              linux_x86)       zig_target=x86-linux-musl ;;
              linux_x64)       zig_target=x86_64-linux-musl ;;
              linux_aarch64)   zig_target=aarch64-linux-musl ;;
              linux_armv7)     zig_target=arm-linux-musleabi ;;
              windows_x86)     zig_target=x86-windows-gnu ;;
              windows_x64)     zig_target=x86_64-windows-gnu ;;
              windows_aarch64) zig_target=aarch64-windows-gnu ;;
              macos_x64)       zig_target=x86_64-macos.11.0; mac_arch=x86_64; extra_ld="" ;;
              macos_aarch64)   zig_target=aarch64-macos.11.0; mac_arch=arm64;  extra_ld="" ;;
            esac

            build_libwebp "$name" "$zig_target"

            # Go 的 cgo 编译器：macOS 用 Xcode 的 clang（需要 SDK 里的
            # libSystem 与框架，zig 在非 macOS 主机上找不到），其余用 zig。
            local go_cc="/tmp/go-cc-$name.sh"
            if [ -n "$mac_arch" ]; then
              printf '#!/bin/sh\nexec clang -arch %s "$@"\n' "$mac_arch" > "$go_cc"
            else
              cp "/tmp/libwebp-$name/cc.sh" "$go_cc"
            fi
            chmod +x "$go_cc"

            local dir="dist/$name"
            mkdir -p "$dir"
            # windows/arm64 上 lld-link 不认 zig ar 写的 ARM64 归档索引，
            # 只能强制拉入整个归档（体积略增，仅此目标）。
            local webp_ld="-L/tmp/libwebp-$name/build -lwebp -lsharpyuv -lm"
            if [ "$name" = "windows_aarch64" ]; then
              webp_ld="-L/tmp/libwebp-$name/build -Wl,--whole-archive -lwebp -lsharpyuv -Wl,--no-whole-archive -lm"
            fi
            local ldf="-s -w -X main.version=${version} -linkmode external"
            if [ -n "$extra_ld" ]; then
              ldf="$ldf -extldflags $extra_ld"
            fi
            env CGO_ENABLED=1 \
              CC="$go_cc" \
              CGO_CFLAGS="-I/tmp/libwebp/src" \
              CGO_LDFLAGS="$webp_ld" \
              GOARCH="$goarch" GOARM="${goarm:-}" \
              go build -trimpath -tags "netgo,osusergo" \
              -ldflags "$ldf" \
              -o "$dir/randamu$ext" .
            # UPX 压缩：静态二进制压到约 33%。压缩后仍是单文件，运行时解压
            # 到内存，不落盘。
            if command -v upx > /dev/null 2>&1; then
              upx --lzma --ultra-brute "$dir/randamu$ext" > /dev/null 2>&1 || true
            fi
            cp README.md LICENSE "$dir/"
            if [ "$GOOS" = "windows" ]; then
              cp contrib/windows/install.ps1 contrib/windows/uninstall.ps1 "$dir/"
            fi
            if [ -n "$tess" ]; then
              # Windows x64/x86 ship a bundled tesseract (with its DLL
              # dependency closure and the English model) so skip_promo_text
              # works without installing anything. There is no official
              # Windows arm64 build, so that archive relies on tesseract in
              # PATH.
              local bundle="$dir/tesseract" tdir
              tdir="$(tesseract_dir "$tess")"
              cp THIRD-PARTY-NOTICES.md "$dir/"
              mkdir -p "$bundle/tessdata"
              cp "$tdir/tesseract.exe" "$tdir"/*.dll "$bundle/"
              cp "$tdir/tessdata/eng.traineddata" "$bundle/tessdata/"
              cp -r "$tdir/tessdata/configs" "$bundle/tessdata/"
              cp "$tdir/doc/LICENSE" "$bundle/LICENSE"
            fi
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -qr "randamu_${version}_${name}.zip" "$name")
              # NSIS installer with the same staged payload. makensis resolves
              # payload and output paths against its script directory, so both
              # are absolute.
              local payload out
              payload="$(pwd)/$dir"
              out="$(pwd)/dist/randamu_${version}_${name}_setup.exe"
              makensis -V2 -DVERSION="$version" -DARCH="$goarch" \
                -DPAYLOAD="$payload" -DOUTFILE="$out" \
                contrib/windows/installer.nsi
            else
              tar -C dist -czf "dist/randamu_${version}_${name}.tar.gz" "$name"
            fi
            if [ "$GOOS" = "darwin" ]; then
              # Per-architecture .pkg installing into /usr/local/bin. pkgbuild
              # records the source ownership, so the tree must belong to root.
              local root="/tmp/pkgroot-$name"
              rm -rf "$root"
              mkdir -p "$root/usr/local/bin" "$root/usr/local/share/doc/randamu"
              cp "$dir/randamu" "$root/usr/local/bin/"
              cp README.md LICENSE "$root/usr/local/share/doc/randamu/"
              sudo chown -R root:wheel "$root"
              pkgbuild --root "$root" --identifier "com.maikotan.randamu" \
                --version "$version" --install-location / \
                "dist/randamu_${version}_${name}.pkg"
              # The tree is root-owned after the chown above.
              sudo rm -rf "$root"
            fi
            if [ "$GOOS" = "linux" ] && [ -n "$nfpm_arch" ]; then
              # deb/rpm; nfpm expands ${NFPM_ARCH}/${NFPM_VERSION} from the
              # environment and reads relative paths from the repo root.
              cp "$dir/randamu" ./randamu
              NFPM_ARCH="$nfpm_arch" NFPM_VERSION="$version" \
                nfpm package -f packaging/nfpm.yaml -p deb \
                -t "dist/randamu_${version}_${name}.deb"
              NFPM_ARCH="$nfpm_arch" NFPM_VERSION="$version" \
                nfpm package -f packaging/nfpm.yaml -p rpm \
                -t "dist/randamu_${version}_${name}.rpm"
              rm ./randamu
            fi
            rm -rf "$dir"
          }

          case "$GOOS" in
            linux)
              build_one "386"  "" linux_x86      "386"  ""
              build_one amd64 "" linux_x64      amd64  ""
              build_one arm64 "" linux_aarch64  arm64  ""
              build_one arm   "7" linux_armv7   arm    ""
              ;;
            windows)
              build_one "386"  "" windows_x86     ""      w32
              build_one amd64 "" windows_x64     ""      w64
              build_one arm64 "" windows_aarch64 ""      ""
              ;;
            darwin)
              build_one amd64 "" macos_x64      ""     ""
              build_one arm64 "" macos_aarch64  ""     ""
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.zip ./*.deb ./*.rpm ./*.exe ./*.pkg > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" ./dist/* \
            --title "randamu ${VERSION#v}" \
            --generate-notes \
            --verify-tag
