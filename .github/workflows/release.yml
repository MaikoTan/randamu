name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, runner: ubuntu-latest }
          - { goos: windows, runner: ubuntu-latest }
          # pkgbuild only exists on macOS; the darwin job runs there.
          - { goos: darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full binutils nsis
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz"
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/checksums.txt \
            | awk '/^.*  nfpm_2\.48\.0_Linux_x86_64\.tar\.gz$/ {print $1 "  /tmp/nfpm.tar.gz"}' | sha256sum -c -
          tar -C /usr/local/bin -xzf /tmp/nfpm.tar.gz nfpm
      - name: Build
        # CGO is disabled so every binary is fully static. The Linux builds
        # therefore run on both glibc and musl distributions and no separate
        # libc variants are needed. Each GOOS job loops over its architectures
        # serially: the compiler already uses every core per target, and one
        # job per GOOS keeps the environment setup (checkout, Go toolchain,
        # apt) to a third of what a per-architecture matrix would spend.
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi

          # Download and prune the tesseract installers once; both x86 and
          # x64 stages copy from these trees. A plain case instead of an
          # associative array keeps this script compatible with bash 3.2,
          # which macOS runners still use.
          tesseract_dir() {
            case "$1" in
              w32) echo /tmp/tesseract-w32 ;;
              w64) echo /tmp/tesseract-w64 ;;
            esac
          }
          if [ "$GOOS" = "windows" ]; then
            for spec in "w32 5.3.0.20221222 33d7824a440e1660b74dc55f10355b346a22fdbe430143f7f6885cfa3cfdf7e7" \
                        "w64 5.4.0.20240606 c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9"; do
              read -r arch tessver hash <<< "$spec"
              installer="/tmp/tesseract-$arch.exe"
              curl -fsSL -o "$installer" \
                "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-$arch-setup-$tessver.exe"
              echo "$hash  $installer" | sha256sum -c -
              # The installer is an NSIS archive; 7z extracts it without running it.
              mkdir "/tmp/tesseract-$arch"
              7z x -o"/tmp/tesseract-$arch" "$installer" > /dev/null
              # Drop the ~160MB of unrelated tooling the installer carries and
              # keep only the DLLs tesseract.exe loads, directly or transitively.
              python3 .github/scripts/prune_tesseract.py "/tmp/tesseract-$arch"
              # Strip debug symbols: shrinks the bundle ~5x, imports untouched.
              for f in "/tmp/tesseract-$arch/tesseract.exe" "/tmp/tesseract-$arch"/*.dll; do
                objcopy --strip-all "$f"
              done
            done
          fi

          build_one() {
            local goarch="$1" goarm="$2" name="$3" nfpm_arch="$4" tess="$5"
            local dir="dist/$name"
            mkdir -p "$dir"
            env GOARCH="$goarch" GOARM="${goarm:-}" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "$dir/randamu$ext" .
            cp README.md LICENSE "$dir/"
            if [ "$GOOS" = "windows" ]; then
              cp contrib/windows/install.ps1 contrib/windows/uninstall.ps1 "$dir/"
            fi
            if [ -n "$tess" ]; then
              # Windows x64/x86 ship a bundled tesseract (with its DLL
              # dependency closure and the English model) so skip_promo_text
              # works without installing anything. There is no official
              # Windows arm64 build, so that archive relies on tesseract in
              # PATH.
              local bundle="$dir/tesseract" tdir
              tdir="$(tesseract_dir "$tess")"
              cp THIRD-PARTY-NOTICES.md "$dir/"
              mkdir -p "$bundle/tessdata"
              cp "$tdir/tesseract.exe" "$tdir"/*.dll "$bundle/"
              cp "$tdir/tessdata/eng.traineddata" "$bundle/tessdata/"
              cp -r "$tdir/tessdata/configs" "$bundle/tessdata/"
              cp "$tdir/doc/LICENSE" "$bundle/LICENSE"
            fi
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -qr "randamu_${version}_${name}.zip" "$name")
              # NSIS installer with the same staged payload. makensis resolves
              # payload and output paths against its script directory, so both
              # are absolute.
              local payload out
              payload="$(pwd)/$dir"
              out="$(pwd)/dist/randamu_${version}_${name}_setup.exe"
              makensis -V2 -DVERSION="$version" -DARCH="$goarch" \
                -DPAYLOAD="$payload" -DOUTFILE="$out" \
                contrib/windows/installer.nsi
            else
              tar -C dist -czf "dist/randamu_${version}_${name}.tar.gz" "$name"
            fi
            if [ "$GOOS" = "darwin" ]; then
              # Per-architecture .pkg installing into /usr/local/bin. pkgbuild
              # records the source ownership, so the tree must belong to root.
              local root="/tmp/pkgroot-$name"
              rm -rf "$root"
              mkdir -p "$root/usr/local/bin" "$root/usr/local/share/doc/randamu"
              cp "$dir/randamu" "$root/usr/local/bin/"
              cp README.md LICENSE "$root/usr/local/share/doc/randamu/"
              sudo chown -R root:wheel "$root"
              pkgbuild --root "$root" --identifier "com.maikotan.randamu" \
                --version "$version" --install-location / \
                "dist/randamu_${version}_${name}.pkg"
              # The tree is root-owned after the chown above.
              sudo rm -rf "$root"
            fi
            if [ "$GOOS" = "linux" ] && [ -n "$nfpm_arch" ]; then
              # deb/rpm; nfpm expands ${NFPM_ARCH}/${NFPM_VERSION} from the
              # environment and reads relative paths from the repo root.
              cp "$dir/randamu" ./randamu
              NFPM_ARCH="$nfpm_arch" NFPM_VERSION="$version" \
                nfpm package -f packaging/nfpm.yaml -p deb \
                -t "dist/randamu_${version}_${name}.deb"
              NFPM_ARCH="$nfpm_arch" NFPM_VERSION="$version" \
                nfpm package -f packaging/nfpm.yaml -p rpm \
                -t "dist/randamu_${version}_${name}.rpm"
              rm ./randamu
            fi
            rm -rf "$dir"
          }

          case "$GOOS" in
            linux)
              build_one "386"  "" linux_x86      "386"  ""
              build_one amd64 "" linux_x64      amd64  ""
              build_one arm64 "" linux_aarch64  arm64  ""
              build_one arm   "7" linux_armv7   arm    ""
              ;;
            windows)
              build_one "386"  "" windows_x86     ""      w32
              build_one amd64 "" windows_x64     ""      w64
              build_one arm64 "" windows_aarch64 ""      ""
              ;;
            darwin)
              build_one amd64 "" macos_x64      ""     ""
              build_one arm64 "" macos_aarch64  ""     ""
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.zip ./*.deb ./*.rpm ./*.exe ./*.pkg > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" ./dist/* \
            --title "randamu ${VERSION#v}" \
            --generate-notes \
            --verify-tag
