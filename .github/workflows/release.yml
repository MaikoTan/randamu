name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: "386", name: linux_x86, nfpm_arch: "386" }
          - { goos: linux, goarch: amd64, name: linux_x64, nfpm_arch: amd64 }
          - { goos: linux, goarch: arm64, name: linux_aarch64, nfpm_arch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7", name: linux_armv7, nfpm_arch: arm }
          - { goos: windows, goarch: "386", name: windows_x86, tess: "w32 5.3.0.20221222", tess_hash: "33d7824a440e1660b74dc55f10355b346a22fdbe430143f7f6885cfa3cfdf7e7" }
          - { goos: windows, goarch: amd64, name: windows_x64, tess: "w64 5.4.0.20240606", tess_hash: "c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9" }
          - { goos: windows, goarch: arm64, name: windows_aarch64 }
          - { goos: darwin, goarch: amd64, name: macos_x64 }
          - { goos: darwin, goarch: arm64, name: macos_aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install nfpm
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz"
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/checksums.txt \
            | awk '/^.*  nfpm_2\.48\.0_Linux_x86_64\.tar\.gz$/ {print $1 "  /tmp/nfpm.tar.gz"}' | sha256sum -c -
          tar -C /usr/local/bin -xzf /tmp/nfpm.tar.gz nfpm
      - name: Build
        # CGO is disabled so every binary is fully static. The Linux builds
        # therefore run on both glibc and musl distributions and no separate
        # libc variants are needed.
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ github.ref_name }}
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          NFPM_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full binutils
          version="${VERSION#v}"
          if [ -n "$NFPM_VERSION" ]; then
            NFPM_VERSION="${version}"
          fi
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          mkdir -p "dist/${{ matrix.name }}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/${{ matrix.name }}/randamu${ext}" .
          cp README.md LICENSE "dist/${{ matrix.name }}/"
          if [ "$GOOS" = "windows" ]; then
            cp contrib/windows/install.ps1 contrib/windows/uninstall.ps1 "dist/${{ matrix.name }}/"
          fi
          # Windows x64/x86 ship a bundled tesseract (with its DLL dependency
          # closure and the English model) so skip_promo_text works without
          # installing anything. There is no official Windows arm64 build,
          # so that archive relies on tesseract in PATH.
          if [ -n "${{ matrix.tess }}" ]; then
            set -- ${{ matrix.tess }}   # tess: "<arch> <version>"
            installer="/tmp/tesseract-$1.exe"
            curl -fsSL -o "$installer" \
              "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-$1-setup-$2.exe"
            echo "${{ matrix.tess_hash }}  $installer" | sha256sum -c -
            # The installer is an NSIS archive; 7z extracts it without running it.
            mkdir /tmp/tesseract
            7z x -o/tmp/tesseract "$installer" > /dev/null
            # Drop the ~160MB of unrelated tooling the installer carries and
            # keep only the DLLs tesseract.exe loads, directly or transitively.
            python3 .github/scripts/prune_tesseract.py /tmp/tesseract
            # Strip debug symbols: shrinks the bundle ~5x, imports untouched.
            for f in /tmp/tesseract/tesseract.exe /tmp/tesseract/*.dll; do
              objcopy --strip-all "$f"
            done
            bundle="dist/${{ matrix.name }}/tesseract"
            cp THIRD-PARTY-NOTICES.md "dist/${{ matrix.name }}/"
            mkdir -p "$bundle/tessdata"
            cp /tmp/tesseract/tesseract.exe /tmp/tesseract/*.dll "$bundle/"
            cp /tmp/tesseract/tessdata/eng.traineddata "$bundle/tessdata/"
            cp -r /tmp/tesseract/tessdata/configs "$bundle/tessdata/"
            cp /tmp/tesseract/doc/LICENSE "$bundle/LICENSE"
            rm -rf /tmp/tesseract "$installer"
          fi
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -qr "randamu_${version}_${{ matrix.name }}.zip" "${{ matrix.name }}")
          else
            tar -C dist -czf "dist/randamu_${version}_${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
          fi
          # deb/rpm for the common Linux architectures; nfpm expands
          # ${NFPM_ARCH}/${NFPM_VERSION} from this environment.
          if [ "$GOOS" = "linux" ] && [ -n "${{ matrix.nfpm_arch }}" ]; then
            cp "dist/${{ matrix.name }}/randamu" ./randamu
            nfpm package -f packaging/nfpm.yaml -p deb \
              -t "dist/randamu_${version}_${{ matrix.name }}.deb"
            nfpm package -f packaging/nfpm.yaml -p rpm \
              -t "dist/randamu_${version}_${{ matrix.name }}.rpm"
            rm ./randamu
          fi
          rm -rf "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.zip ./*.deb ./*.rpm > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" ./dist/* \
            --title "randamu ${VERSION#v}" \
            --generate-notes \
            --verify-tag
